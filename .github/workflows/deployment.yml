name: Deployment Workflow 

on: push

jobs: 
    backend-deployment:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5

            - name: SSH Setup
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/meinPrivateKey
                  chmod 400 ~/.ssh/meinPrivateKey
                  ssh-keyscan -H ${{ secrets.EC2_IP}} >> ~/.ssh/known_hosts
            
            - name: Docker && Docker compose installieren
              run: |
                  ssh -i ~/.ssh/meinPrivateKey ubuntu@${{ secrets.EC2_IP}} '         
                  sudo apt update
                  sudo apt install docker.io -y
                  DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
                  mkdir -p $DOCKER_CONFIG/cli-plugins
                  curl -SL https://github.com/docker/compose/releases/download/v2.40.1/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
                  chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
                  sudo usermod -aG docker ubuntu
                  '
                
            - name: Copy backend directory to ec2
              run: |
                  ssh -i ~/.ssh/meinPrivateKey ubuntu@${{ secrets.EC2_IP}} "mkdir -p backend"
                  scp -i ~/.ssh/meinPrivateKey backend/* ubuntu@${{ secrets.EC2_IP}}:/home/ubuntu/backend      

            - name: Docker compose up
              run: |
                  ssh -i ~/.ssh/meinPrivateKey ubuntu@${{ secrets.EC2_IP}} "
                  cd backend
                  docker compose up -d
                  "
