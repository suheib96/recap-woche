services:
  backend:
    container_name: backendapp
    build: ./backend
    ports:
      - 8005:8000
    networks:
      - docker-compose-backend-db-net
      - docker-compose-frontend-backend-net 
    depends_on:
      postgres_db:
        condition: service_healthy

  
  postgres_db:
    image: postgres:18
    container_name: meineDatenbank
    ports:
      - 8044:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=meinedatabase
    volumes:
      - postgres_db_volume:/var/lib/postgresql
    networks:
      - docker-compose-backend-db-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h","localhost"]
      interval: 2s
      timeout: 5s
      retries: 5      

  frontend:
    container_name: frontendapp
    build: ./frontend
    ports:
      - 8080:80
    networks:
      - docker-compose-frontend-backend-net


networks:
  docker-compose-backend-db-net:
  docker-compose-frontend-backend-net:

volumes:
  postgres_db_volume:
  
    